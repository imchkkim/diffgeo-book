<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400"><rect width="820" height="400" fill="#fff"/>
<g font-family="'Noto Sans KR','Noto Sans CJK KR',sans-serif" fill="#111">
<text x="20" y="28" font-size="17" font-weight="700">① 만들기: 직선에서 원점을 빼고, 그 빈자리에 원점 A와 원점 B를 둘 다 넣는다</text>
<line x1="60" y1="95" x2="760" y2="95" stroke="#222" stroke-width="3"/>
<circle cx="410" cy="95" r="7" fill="#fff" stroke="#222" stroke-width="2.5"/>
<line x1="160" y1="89" x2="160" y2="101" stroke="#222" stroke-width="2"/><text x="160" y="122" font-size="14" text-anchor="middle">−2</text>
<line x1="285" y1="89" x2="285" y2="101" stroke="#222" stroke-width="2"/><text x="285" y="122" font-size="14" text-anchor="middle">−1</text>
<line x1="535" y1="89" x2="535" y2="101" stroke="#222" stroke-width="2"/><text x="535" y="122" font-size="14" text-anchor="middle">1</text>
<line x1="660" y1="89" x2="660" y2="101" stroke="#222" stroke-width="2"/><text x="660" y="122" font-size="14" text-anchor="middle">2</text>
<circle cx="370" cy="60" r="7" fill="#d7372f"/><text x="358" y="65" font-size="15" text-anchor="end" fill="#d7372f">원점 A</text>
<circle cx="450" cy="60" r="7" fill="#2f5fd7"/><text x="462" y="65" font-size="15" fill="#2f5fd7">원점 B</text>
<path d="M376,66 L401,87" stroke="#d7372f" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>
<path d="M444,66 L419,87" stroke="#2f5fd7" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>
<text x="410" y="145" font-size="13" text-anchor="middle" fill="#555">A, B 둘 다 0의 자리에 있다. 나머지 점(1, −1, 0.001 …)은 보통 직선과 똑같다</text>
<text x="230" y="190" font-size="15" font-weight="700" text-anchor="middle">② 동네를 −1 ~ 1로 잡으면</text>
<rect x="105" y="221" width="116" height="78" fill="#8a3fb0" opacity="0.13"/>
<rect x="239" y="221" width="116" height="78" fill="#8a3fb0" opacity="0.13"/>
<line x1="105" y1="235" x2="355" y2="235" stroke="#d7372f" stroke-width="5"/>
<line x1="105" y1="285" x2="355" y2="285" stroke="#2f5fd7" stroke-width="5"/>
<circle cx="230" cy="235" r="7" fill="#d7372f"/><circle cx="230" cy="285" r="7" fill="#2f5fd7"/>
<text x="95" y="240" font-size="14" text-anchor="end" fill="#d7372f">A의 동네</text>
<text x="95" y="290" font-size="14" text-anchor="end" fill="#2f5fd7">B의 동네</text>
<text x="230" y="330" font-size="14" text-anchor="middle" fill="#8a3fb0">보라색 부분은 두 동네에 모두 들어 있다</text>
<text x="105" y="213" font-size="12" text-anchor="middle" fill="#555">−1</text><text x="355" y="213" font-size="12" text-anchor="middle" fill="#555">1</text>
<text x="620" y="190" font-size="15" font-weight="700" text-anchor="middle">③ −0.4 ~ 0.4로 좁혀도</text>
<rect x="570" y="221" width="41" height="78" fill="#8a3fb0" opacity="0.13"/>
<rect x="629" y="221" width="41" height="78" fill="#8a3fb0" opacity="0.13"/>
<line x1="570" y1="235" x2="670" y2="235" stroke="#d7372f" stroke-width="5"/>
<line x1="570" y1="285" x2="670" y2="285" stroke="#2f5fd7" stroke-width="5"/>
<circle cx="620" cy="235" r="7" fill="#d7372f"/><circle cx="620" cy="285" r="7" fill="#2f5fd7"/>
<text x="560" y="240" font-size="14" text-anchor="end" fill="#d7372f">A의 동네</text>
<text x="560" y="290" font-size="14" text-anchor="end" fill="#2f5fd7">B의 동네</text>
<text x="620" y="330" font-size="14" text-anchor="middle" fill="#8a3fb0">보라색 부분은 두 동네에 모두 들어 있다</text>
<text x="570" y="213" font-size="12" text-anchor="middle" fill="#555">−0.4</text><text x="670" y="213" font-size="12" text-anchor="middle" fill="#555">0.4</text>
<text x="410" y="385" font-size="14" text-anchor="middle" fill="#333">동네를 아무리 좁혀도 가운데 한 점만 다르고 양옆은 같다 → A와 B를 떼어 놓을 수 없다</text>
</g></svg>