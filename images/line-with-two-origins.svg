<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460"><rect width="820" height="460" fill="#fff"/>
<g font-family="'Noto Sans KR','Noto Sans CJK KR',sans-serif" fill="#111">
<text x="20" y="28" font-size="17" font-weight="700">① 이어 붙이기: 두 지도의 같은 숫자끼리 붙이되, 0끼리만은 붙이지 않는다</text>
<text x="50" y="80" font-size="14" text-anchor="end" fill="#d7372f">지도 1</text><text x="50" y="155" font-size="14" text-anchor="end" fill="#2f5fd7">지도 2</text>
<line x1="60" y1="75" x2="760" y2="75" stroke="#d7372f" stroke-width="3"/><line x1="60" y1="150" x2="760" y2="150" stroke="#2f5fd7" stroke-width="3"/>
<line x1="110" y1="79" x2="110" y2="146" stroke="#888" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="110" y="65" font-size="12" text-anchor="middle" fill="#555">−2.4</text>
<line x1="160" y1="79" x2="160" y2="146" stroke="#888" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="160" y="65" font-size="12" text-anchor="middle" fill="#555">−2</text>
<line x1="222" y1="79" x2="222" y2="146" stroke="#888" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="222" y="65" font-size="12" text-anchor="middle" fill="#555">−1.5</text>
<line x1="285" y1="79" x2="285" y2="146" stroke="#888" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="285" y="65" font-size="12" text-anchor="middle" fill="#555">−1</text>
<line x1="347" y1="79" x2="347" y2="146" stroke="#888" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="347" y="65" font-size="12" text-anchor="middle" fill="#555">−0.5</text>
<line x1="473" y1="79" x2="473" y2="146" stroke="#888" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="473" y="65" font-size="12" text-anchor="middle" fill="#555">0.5</text>
<line x1="535" y1="79" x2="535" y2="146" stroke="#888" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="535" y="65" font-size="12" text-anchor="middle" fill="#555">1</text>
<line x1="597" y1="79" x2="597" y2="146" stroke="#888" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="597" y="65" font-size="12" text-anchor="middle" fill="#555">1.5</text>
<line x1="660" y1="79" x2="660" y2="146" stroke="#888" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="660" y="65" font-size="12" text-anchor="middle" fill="#555">2</text>
<line x1="710" y1="79" x2="710" y2="146" stroke="#888" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="710" y="65" font-size="12" text-anchor="middle" fill="#555">2.4</text>
<circle cx="410" cy="75" r="7" fill="#d7372f"/><circle cx="410" cy="150" r="7" fill="#2f5fd7"/>
<text x="410" y="63" font-size="14" text-anchor="middle" fill="#d7372f">0 = 원점 A</text><text x="410" y="174" font-size="14" text-anchor="middle" fill="#2f5fd7">0 = 원점 B</text>
<text x="410" y="118" font-size="20" text-anchor="middle" fill="#111">✕</text>
<text x="600" y="174" font-size="13" fill="#555">점선: 같은 장소로 붙임   ✕: 붙이지 않음</text>
<text x="410" y="202" font-size="13" text-anchor="middle" fill="#555">0이 아닌 점은 모두 하나로 합쳐져 보통 직선이 되고, 0 자리에만 A와 B가 따로 남는다</text>
<text x="230" y="250" font-size="15" font-weight="700" text-anchor="middle">② 동네를 −1 ~ 1로 잡으면</text>
<rect x="105" y="281" width="116" height="78" fill="#8a3fb0" opacity="0.13"/>
<rect x="239" y="281" width="116" height="78" fill="#8a3fb0" opacity="0.13"/>
<line x1="105" y1="295" x2="355" y2="295" stroke="#d7372f" stroke-width="5"/><line x1="105" y1="345" x2="355" y2="345" stroke="#2f5fd7" stroke-width="5"/>
<circle cx="230" cy="295" r="7" fill="#d7372f"/><circle cx="230" cy="345" r="7" fill="#2f5fd7"/>
<text x="95" y="300" font-size="14" text-anchor="end" fill="#d7372f">A의 동네</text><text x="95" y="350" font-size="14" text-anchor="end" fill="#2f5fd7">B의 동네</text>
<text x="230" y="390" font-size="14" text-anchor="middle" fill="#8a3fb0">보라색 부분은 두 동네에 모두 들어 있다</text>
<text x="105" y="273" font-size="12" text-anchor="middle" fill="#555">−1</text><text x="355" y="273" font-size="12" text-anchor="middle" fill="#555">1</text>
<text x="620" y="250" font-size="15" font-weight="700" text-anchor="middle">③ −0.4 ~ 0.4로 좁혀도</text>
<rect x="570" y="281" width="41" height="78" fill="#8a3fb0" opacity="0.13"/>
<rect x="629" y="281" width="41" height="78" fill="#8a3fb0" opacity="0.13"/>
<line x1="570" y1="295" x2="670" y2="295" stroke="#d7372f" stroke-width="5"/><line x1="570" y1="345" x2="670" y2="345" stroke="#2f5fd7" stroke-width="5"/>
<circle cx="620" cy="295" r="7" fill="#d7372f"/><circle cx="620" cy="345" r="7" fill="#2f5fd7"/>
<text x="560" y="300" font-size="14" text-anchor="end" fill="#d7372f">A의 동네</text><text x="560" y="350" font-size="14" text-anchor="end" fill="#2f5fd7">B의 동네</text>
<text x="620" y="390" font-size="14" text-anchor="middle" fill="#8a3fb0">보라색 부분은 두 동네에 모두 들어 있다</text>
<text x="570" y="273" font-size="12" text-anchor="middle" fill="#555">−0.4</text><text x="670" y="273" font-size="12" text-anchor="middle" fill="#555">0.4</text>
<text x="410" y="445" font-size="14" text-anchor="middle" fill="#333">동네를 아무리 좁혀도 가운데 한 점만 다르고 양옆은 같다 → A와 B를 떼어 놓을 수 없다</text>
</g></svg>